<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Supply Chain Brain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .brain-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
        }
        .strategy-box ul { padding-left: 20px; }
        .strategy-box li { margin-bottom: 8px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🔮 Supply Chain Orchestrator</h2>
        <a href="/" class="btn btn-outline-secondary">Back to Operations</a>
    </div>

    <div class="card brain-card shadow-lg mb-5 border-0">
        <div class="card-body p-5 text-center">
            <h1 class="display-6 mb-3">What happens if...?</h1>
            <p class="text-white-50 mb-4">Simulate real-world events to stress-test your logistics network.</p>
            
            <form action="/simulate-scenario" method="post" class="d-flex justify-content-center gap-2">
                <input type="text" name="scenario" class="form-control form-control-lg w-50" 
                       placeholder="e.g., Heatwave in Texas, Black Friday Rush, Port Strike in NY..." 
                       th:value="${scenario}" required>
                <button type="submit" class="btn btn-primary btn-lg px-4">⚡ Run Simulation</button>
            </form>
        </div>
    </div>

    <div th:if="${strategy}" class="card shadow border-success">
        <div class="card-header bg-success text-white fw-bold">
            🤖 AI Strategic Response Plan: <span th:text="${scenario}"></span>
        </div>
        <div class="card-body strategy-box">
            <div th:utext="${strategy}"></div>
            
            <hr>
            <div class="d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-dark btn-sm">📄 Export Report</button>
                <button class="btn btn-success btn-sm">✅ Auto-Execute Transfers</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
