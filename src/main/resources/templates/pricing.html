<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dynamic Pricing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <div class="card p-5 shadow mx-auto" style="max-width: 500px;">
        <h3>💰 AI Pricing Engine</h3>
        <p class="text-muted">Item: <span th:text="${product.title}"></span></p>
        
        <div class="alert alert-success">
            <strong>AI Suggestion:</strong> $<span th:text="${suggestion}"></span>
        </div>

        <form action="/update-price" method="post">
            <input type="hidden" name="id" th:value="${product.id}">
            <label>Set New Price:</label>
            <input type="number" step="0.01" name="newPrice" class="form-control mb-3" th:value="${suggestion}">
            <button type="submit" class="btn btn-primary w-100">Update Price</button>
        </form>
        <a href="/" class="btn btn-link mt-3">Cancel</a>
    </div>
</body>
</html>
