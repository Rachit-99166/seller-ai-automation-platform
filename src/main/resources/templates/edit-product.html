<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modify Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 600px;">
        <h3>✏️ Modify Details</h3>
        <form action="/update-product" method="post" th:object="${product}">
            <input type="hidden" name="id" th:value="${product.id}">
            
            <div class="mb-3">
                <label>Title</label>
                <input type="text" name="title" class="form-control" th:value="${product.title}" required>
            </div>
            
            <div class="mb-3">
                <label>Category</label>
                <input type="text" name="category" class="form-control" th:value="${product.category}" required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4" required th:text="${product.description}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
        <a href="/" class="btn btn-link mt-3 text-center d-block">Cancel</a>
    </div>
</body>
</html>
