<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seller Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .ai-badge {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="ai-badge">🤖 AI Gatekeeper Active</div>
    <h2 class="mb-3">Seller Verification</h2>
    <p class="text-muted mb-4">Enter your registered company name. Our AI will audit your brand reputation before granting access.</p>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form action="/verify-seller" method="post">
        <div class="mb-3">
            <input type="text" name="companyName" class="form-control form-control-lg text-center" 
                   placeholder="e.g. Nike, Apple, Tesla" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Verify Identity</button>
    </form>
    
    <div class="mt-3">
        <small class="text-muted">Powered by Groq Llama-3 Risk Analysis</small>
    </div>
</div>

</body>
</html>
