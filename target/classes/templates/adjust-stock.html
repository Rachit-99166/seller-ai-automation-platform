<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adjust Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <div class="card p-5 shadow mx-auto" style="max-width: 400px;">
        <h3>📦 Inventory Manager</h3>
        <p class="text-muted">Item: <span th:text="${product.title}"></span></p>
        
        <div class="display-4 mb-3" th:text="${product.stockQuantity}"></div>
        <p>Current Units</p>

        <form action="/update-stock-manual" method="post">
            <input type="hidden" name="id" th:value="${product.id}">
            <label>Set New Quantity:</label>
            <input type="number" name="newStock" class="form-control mb-3" th:value="${product.stockQuantity}" required>
            <button type="submit" class="btn btn-warning w-100">Update Stock</button>
        </form>
        <a href="/" class="btn btn-link mt-3">Cancel</a>
    </div>
</body>
</html>
